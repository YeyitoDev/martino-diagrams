# En cada push a master: prueba, compila Martino con la UI embebida y lo despliega en Fly.
# Necesita el secreto FLY_API_TOKEN del repo (fly tokens create deploy -a martino); la demo sin llave,
# FLY_DEMO_API_TOKEN (fly tokens create deploy -a martino-demo).
name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
concurrency: deploy-fly
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_DEMO_API_TOKEN: ${{ secrets.FLY_DEMO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: UI (wasm)
        working-directory: crates/web
        run: trunk build --release
      - name: Pruebas
        run: cargo test -p martino-core -p martino
      - name: Binario
        run: cargo build --release -p martino
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != '' || env.FLY_DEMO_API_TOKEN != ''
      - name: Desplegar en Fly
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Desplegar la demo sin llave (martino-demo)
        if: env.FLY_DEMO_API_TOKEN != ''
        run: flyctl deploy --remote-only -c fly.demo.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEMO_API_TOKEN }}
      - name: Sin token
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::Falta el secreto FLY_API_TOKEN; se compiló y probó, pero no se desplegó."
