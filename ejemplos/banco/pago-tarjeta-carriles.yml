# Mismo flujo que pago-tarjeta.yml, ordenado en carriles por sistema (orden: carriles):
# una fila para Martino, una por sistema que llama (Cuentas, Core de tarjetas) y una para las respuestas.
nombre: Pago de tarjeta · carriles por sistema
orden: carriles
coleccion: banco
inicio: [cuenta]
nodos:
  - clave: entrada
    tipo: entrada
    nombre: Entrada
    desc: Lo que manda la app móvil. nroCuenta es la cuenta de donde sale el dinero; nroTarjeta, la tarjeta que se paga.
    data: { nroCuenta: "191-0001", nroTarjeta: "4111111111111111", monto: 250, moneda: PEN }

  - clave: cuenta
    tipo: servicio
    nombre: Consultar cuenta
    desc: "Sistema de cuentas · GET /cuentas/{nroCuenta}. Trae saldoDisponible y estado; no mueve dinero. 404 si la cuenta no existe."
    ref: Cuentas/Consultar-cuenta.yml
    vars: [{ name: nroCuenta, value: "{{entrada.nroCuenta}}" }]
    siguiente: [puede_pagar]
    error: [no_existe]

  - clave: puede_pagar
    tipo: condicion
    nombre: ¿Cuenta activa y con saldo?
    desc: Regla de negocio antes de tocar dinero. Evita una retención que el sistema de cuentas igual rechazaría (423 o 422).
    mode: all
    rules:
      - { left: cuenta.response.estado, op: eq, right: ACTIVA }
      - { left: cuenta.response.saldoDisponible, op: gte, right: "{{entrada.monto}}" }
    si: [retener]
    no: [rechazo]

  - clave: retener
    tipo: servicio
    nombre: Retener fondos
    desc: "Sistema de cuentas · POST /retenciones. Congela el monto (no lo debita aún) y devuelve retencionId. Idempotency-Key = referencia, para que un reintento no retenga dos veces."
    ref: Cuentas/Retener-fondos.yml
    vars:
      - { name: nroCuenta, value: "{{entrada.nroCuenta}}" }
      - { name: monto, value: "{{entrada.monto}}" }
      - { name: moneda, value: "{{entrada.moneda}}" }
      - { name: referencia, value: "PAGO-{{$timestamp}}" }
    siguiente: [ret]
    error: [rechazo_cuenta]

  - clave: ret
    tipo: extraer
    nombre: Guardar retencionId
    desc: El valor que une los dos sistemas. El core de tarjetas sólo abona si recibe una retención válida y sin usar.
    vars: [{ name: retencionId, value: retener.response.retencionId }]
    siguiente: [pagar]

  - clave: pagar
    tipo: servicio
    nombre: Pagar tarjeta
    desc: "Core de tarjetas · POST /pagos. El monto lo toma de la retención. Responde 202 RECEIVED con transaccionId: el posteo es asíncrono. 409 si la retención no existe o ya se usó."
    ref: Core-tarjetas/Pagar-tarjeta.yml
    vars:
      - { name: nroTarjeta, value: "{{entrada.nroTarjeta}}" }
      - { name: retencionId, value: "{{retencionId}}" }
    siguiente: [tx]
    error: [falla_core]

  - clave: tx
    tipo: extraer
    nombre: Guardar transaccionId
    desc: Identificador del pago en el core; con él se consulta el estado contable.
    vars: [{ name: transaccionId, value: pagar.response.transaccionId }]
    siguiente: [detalle]

  - clave: detalle
    tipo: servicio
    nombre: Detalle de transacción
    desc: "Core de tarjetas · GET /transacciones/{id}. Hasta 1000 PEN: POSTED con codigoAutorizacion y fechaContable. Más de 1000: PENDING por revisión antifraude."
    ref: Core-tarjetas/Detalle-transaccion.yml
    vars: [{ name: transaccionId, value: "{{transaccionId}}" }]
    siguiente: [posteado]
    error: [falla_core]

  - clave: posteado
    tipo: condicion
    nombre: ¿Quedó POSTED?
    rules: [{ left: detalle.response.estado, op: eq, right: POSTED }]
    si: [ok]
    no: [pendiente]

  - clave: ok
    tipo: respuesta
    nombre: 200 Pago posteado
    status: "200"
    body:
      estado: POSTED
      transaccionId: "{{transaccionId}}"
      autorizacion: "{{detalle.response.codigoAutorizacion}}"
      fechaContable: "{{detalle.response.fechaContable}}"
      monto: "{{detalle.response.monto}}"
      tarjeta: "{{detalle.response.tarjeta}}"
      saldoRestante: "{{retener.response.saldoDisponible}}"

  - clave: pendiente
    tipo: respuesta
    nombre: 202 Pago pendiente
    status: "202"
    body:
      estado: PENDING
      transaccionId: "{{transaccionId}}"
      motivo: "{{detalle.response.motivo}}"
      monto: "{{detalle.response.monto}}"

  - clave: rechazo
    tipo: respuesta
    nombre: 422 No puede pagar
    status: "422"
    body:
      error: { codigo: NO_PUEDE_PAGAR, estadoCuenta: "{{cuenta.response.estado}}", saldo: "{{cuenta.response.saldoDisponible}}" }

  - clave: rechazo_cuenta
    tipo: respuesta
    nombre: Rechazo del sistema de cuentas
    status: "{{retener.status}}"
    body:
      error: { codigo: "{{retener.response.codigo}}", mensaje: "{{retener.response.mensaje}}" }

  - clave: no_existe
    tipo: respuesta
    nombre: 404 Cuenta no existe
    status: "404"
    body:
      error: { codigo: "{{cuenta.response.codigo}}" }

  - clave: falla_core
    tipo: respuesta
    nombre: 502 Falla del core
    status: "502"
    body:
      error: { codigo: CORE_TARJETAS, detalle: "{{pagar.response.codigo}}" }

  - clave: valores
    tipo: nota
    nombre: Valores que viajan
    pos: [180, -150]
    text: "entrada.nroCuenta → Consultar y Retener · entrada.monto → Retener (el core lo toma de la retención) · retencionId: Retener → Pagar · transaccionId: Pagar → Detalle · estado: Detalle → ¿POSTED?"

casos:
  - id: PAG-001
    name: Pago chico se postea
    input: { nroCuenta: "191-0001", nroTarjeta: "4111111111111111", monto: 250, moneda: PEN }
    expectStatus: 200
    expect: [{ left: estado, op: eq, right: POSTED }, { left: saldoRestante, op: eq, right: "4750" }]
  - id: PAG-002
    name: Pago grande queda pendiente
    input: { nroCuenta: "191-0001", nroTarjeta: "4111111111111111", monto: 2500, moneda: PEN }
    expectStatus: 202
    expect: [{ left: motivo, op: eq, right: REVISION_ANTIFRAUDE }]
  - id: PAG-003
    name: Saldo insuficiente
    input: { nroCuenta: "191-0002", nroTarjeta: "4111111111111111", monto: 250, moneda: PEN }
    expectStatus: 422
    expect: [{ left: nodo, op: eq, right: rechazo }]
  - id: PAG-004
    name: Cuenta bloqueada
    input: { nroCuenta: "191-0003", nroTarjeta: "4111111111111111", monto: 100, moneda: PEN }
    expectStatus: 422
    expect: [{ left: error.estadoCuenta, op: eq, right: BLOQUEADA }]
  - id: PAG-005
    name: Cuenta inexistente
    input: { nroCuenta: "999-9999", nroTarjeta: "4111111111111111", monto: 100, moneda: PEN }
    expectStatus: 404
    expect: [{ left: error.codigo, op: eq, right: CUENTA_NO_EXISTE }]
  - id: PAG-006
    name: Tarjeta inexistente
    input: { nroCuenta: "191-0001", nroTarjeta: "5500000000000004", monto: 100, moneda: PEN }
    expectStatus: 502
    expect: [{ left: error.detalle, op: eq, right: TARJETA_NO_EXISTE }]
